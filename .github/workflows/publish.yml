# Builds wheels (Windows/Linux, amd64 + arm64) and an sdist, then publishes
# everything to TestPyPI or PyPI. Started manually from the Actions tab
# ("Run workflow"), where the target index is chosen.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API tokens needed.
# One-time setup on https://test.pypi.org / https://pypi.org:
#   project -> Manage -> Publishing -> add GitHub publisher with
#   owner "Kezreux", repository "NORMAlizer", workflow "publish.yml"
#   and environment "testpypi" (and/or "pypi").

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package index to publish to"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
        required: true

jobs:
  build_wheels:
    name: Wheels ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The arm64 runners (ubuntu-24.04-arm / windows-11-arm) are free for
          # public repositories only. For a private repository, replace
          # linux-arm64 with QEMU emulation on ubuntu-latest
          # (docker/setup-qemu-action + CIBW_ARCHS: aarch64) and drop
          # windows-arm64 or use a larger paid runner.
          - { name: linux-amd64,   os: ubuntu-latest,    archs: x86_64 }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, archs: aarch64 }
          - { name: windows-amd64, os: windows-latest,   archs: AMD64 }
          - { name: windows-arm64, os: windows-11-arm,   archs: ARM64 }

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to ${{ inputs.target }}
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write  # OIDC token for Trusted Publishing

    steps:
      - name: Collect wheels and sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
